<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER ARTWORK — volcanic stone and brass details. Replace with a real photo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sdWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221A15"/>
      <stop offset="0.55" stop-color="#17120F"/>
      <stop offset="1" stop-color="#0A0807"/>
    </linearGradient>
    <linearGradient id="sdStone" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3A322C"/>
      <stop offset="0.5" stop-color="#2A2420"/>
      <stop offset="1" stop-color="#1B1714"/>
    </linearGradient>
    <linearGradient id="sdBrass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A5A2E"/>
      <stop offset="0.35" stop-color="#C8A15A"/>
      <stop offset="0.6" stop-color="#8A6836"/>
      <stop offset="1" stop-color="#4A3620"/>
    </linearGradient>
    <radialGradient id="sdGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD79F" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#E28B3B" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E28B3B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sdLight" cx="0.74" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#F0B372" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E28B3B" stop-opacity="0"/>
    </radialGradient>
    <filter id="sdGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="sdVignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.48" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="1400" fill="url(#sdWall)"/>
  <rect width="1400" height="1400" fill="url(#sdLight)"/>

  <!-- volcanic stone coursing -->
  <g stroke="#0B0908" stroke-width="7">
    <path d="M0 150 H1400 M0 420 H1400 M0 690 H1400 M0 960 H1400 M0 1230 H1400"/>
    <path d="M240 0 V150 M620 0 V150 M980 0 V150 M1240 0 V150"/>
    <path d="M120 150 V420 M520 150 V420 M900 150 V420 M1200 150 V420"/>
    <path d="M300 420 V690 M700 420 V690 M1060 420 V690"/>
    <path d="M160 690 V960 M560 690 V960 M940 690 V960 M1240 690 V960"/>
    <path d="M340 960 V1230 M780 960 V1230 M1120 960 V1230"/>
  </g>
  <!-- individual stone faces, slightly varied so the wall reads as natural rock -->
  <g fill="url(#sdStone)">
    <rect x="6" y="156" width="228" height="258"/>
    <rect x="252" y="156" width="262" height="258" opacity="0.92"/>
    <rect x="632" y="156" width="262" height="258" opacity="0.86"/>
    <rect x="992" y="156" width="242" height="258" opacity="0.9"/>
    <rect x="126" y="426" width="388" height="258" opacity="0.94"/>
    <rect x="526" y="426" width="368" height="258" opacity="0.88"/>
    <rect x="906" y="426" width="288" height="258" opacity="0.92"/>
    <rect x="6" y="696" width="286" height="258" opacity="0.9"/>
    <rect x="306" y="696" width="380" height="258" opacity="0.84"/>
    <rect x="706" y="696" width="340" height="258" opacity="0.93"/>
    <rect x="166" y="966" width="380" height="258" opacity="0.88"/>
    <rect x="566" y="966" width="360" height="258" opacity="0.9"/>
    <rect x="946" y="966" width="300" height="258" opacity="0.86"/>
  </g>
  <!-- subtle scoria texture specks -->
  <g fill="#0D0B0A" opacity="0.5">
    <circle cx="120" cy="240" r="7"/>
    <circle cx="300" cy="330" r="5"/>
    <circle cx="520" cy="210" r="6"/>
    <circle cx="700" cy="360" r="8"/>
    <circle cx="980" cy="250" r="5"/>
    <circle cx="240" cy="520" r="7"/>
    <circle cx="640" cy="560" r="6"/>
    <circle cx="1120" cy="520" r="7"/>
    <circle cx="420" cy="800" r="6"/>
    <circle cx="860" cy="820" r="8"/>
    <circle cx="1180" cy="1060" r="6"/>
    <circle cx="640" cy="1120" r="7"/>
  </g>
  <g fill="#4A413A" opacity="0.28">
    <circle cx="180" cy="200" r="4"/>
    <circle cx="620" cy="300" r="3.4"/>
    <circle cx="1020" cy="620" r="4"/>
    <circle cx="300" cy="1040" r="3.6"/>
    <circle cx="900" cy="1120" r="4"/>
  </g>

  <!-- brass wall light with warm glow -->
  <g>
    <rect x="666" y="470" width="68" height="14" rx="4" fill="#241A12"/>
    <rect x="676" y="360" width="48" height="112" rx="6" fill="url(#sdBrass)"/>
    <circle cx="700" cy="520" r="16" fill="#E28B3B" opacity="0.9"/>
    <path d="M628 520 h144 l-30 96 h-84 z" fill="#2A1E15"/>
    <circle cx="700" cy="536" r="330" fill="url(#sdGlow)" opacity="0.4"/>
  </g>

  <!-- thin brass rule, echoing the site's hairline dividers -->
  <rect x="0" y="864" width="1400" height="3" fill="url(#sdBrass)" opacity="0.3"/>

  <rect width="1400" height="1400" fill="url(#sdVignette)"/>
  <rect width="1400" height="1400" filter="url(#sdGrain)" opacity="0.07" style="mix-blend-mode:overlay"/>
  <text x="1360" y="1360" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14"
        letter-spacing="3.5" fill="#B6AB9E" opacity="0.42">PLACEHOLDER ARTWORK · REPLACE WITH OFFICIAL PHOTO</text>
</svg>