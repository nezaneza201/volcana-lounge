      <ellipse cx="90" cy="130" rx="70" ry="44"/>
      <ellipse cx="180" cy="-150" rx="56" ry="36"/>
      <ellipse cx="-190" cy="140" rx="62" ry="38"/>
    </g>
    <g fill="#B9752F" opacity="0.3">
      <ellipse cx="30" cy="-40" rx="74" ry="40"/>
      <ellipse cx="-60" cy="210" rx="58" ry="30"/>
      <ellipse cx="230" cy="40" rx="46" ry="28"/>
