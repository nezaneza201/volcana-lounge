<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER ARTWORK — wood-fired pizza, overhead. Replace with a real photo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="pzBoard" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#2A2119"/>
      <stop offset="0.6" stop-color="#191411"/>
      <stop offset="1" stop-color="#0B0908"/>
    </radialGradient>
    <radialGradient id="pzGlow" cx="0.32" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#F0B372" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#E28B3B" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#E28B3B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pzCrust" cx="0.42" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#E4B173"/>
      <stop offset="0.62" stop-color="#C98A4B"/>
      <stop offset="1" stop-color="#8E5A2C"/>
    </radialGradient>
    <radialGradient id="pzSauce" cx="0.44" cy="0.4" r="0.66">
      <stop offset="0" stop-color="#A8442A"/>
      <stop offset="1" stop-color="#6E2A18"/>
    </radialGradient>
    <radialGradient id="pzCheese" cx="0.42" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#F2D69B"/>
      <stop offset="0.7" stop-color="#E0B96B"/>
      <stop offset="1" stop-color="#C3954A"/>
    </radialGradient>
    <filter id="pzGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="pzSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <radialGradient id="pzVignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="1400" fill="url(#pzBoard)"/>
  <g fill="#1E1813" opacity="0.5">
    <rect x="70" y="90" width="300" height="180" rx="10"/>
    <rect x="1030" y="180" width="280" height="150" rx="10"/>
    <rect x="150" y="1080" width="260" height="170" rx="10"/>
  </g>
  <rect x="1180" y="1140" width="260" height="46" rx="18" fill="#4A3624" transform="rotate(-24 1180 1140)"/>
  <rect width="1400" height="1400" fill="url(#pzGlow)"/>
<!-- pizza -->
  <g transform="translate(700 690)">
    <circle r="470" fill="#0F0C09" opacity="0.55" filter="url(#pzSoft)"/>
    <circle r="452" fill="url(#pzCrust)"/>
    <circle r="360" fill="url(#pzSauce)"/>
    <circle r="348" fill="url(#pzCheese)"/>

    <g fill="#F6E3B4" opacity="0.35">
