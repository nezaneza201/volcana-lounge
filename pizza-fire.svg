    </g>
    <g transform="translate(-40 230)">
      <circle r="44" fill="#A8361F"/>
      <circle r="34" fill="#C9492C"/>
    </g>

    <g fill="#FBF1D9" opacity="0.92">
      <ellipse cx="-30" cy="-120" rx="40" ry="30"/>
      <ellipse cx="110" cy="60" rx="36" ry="26"/>
      <ellipse cx="-160" cy="30" rx="32" ry="24"/>
      <ellipse cx="60" cy="-260" rx="30" ry="22"/>
      <ellipse cx="250" cy="180" rx="28" ry="20"/>
    </g>

    <g fill="#3F6B3C">
      <path d="M-230 -60 q48 -34 92 -6 q-44 40 -92 6 z"/>
      <path d="M120 -220 q50 -30 92 0 q-46 36 -92 0 z"/>
      <path d="M-90 320 q46 -32 88 -4 q-42 36 -88 4 z"/>
    </g>
    <g fill="#2F5230" opacity="0.7">
      <path d="M-230 -60 q48 -4 92 -6 q-44 8 -92 6 z"/>
      <path d="M120 -220 q50 -2 92 0 q-46 6 -92 0 z"/>
    </g>

    <!-- char blisters -->
    <g fill="#4A2A12" opacity="0.72">
      <ellipse cx="-330" cy="-120" rx="42" ry="16" transform="rotate(-28 -330 -120)"/>
      <ellipse cx="-250" cy="230" rx="38" ry="14" transform="rotate(34 -250 230)"/>
      <ellipse cx="330" cy="120" rx="44" ry="15" transform="rotate(22 330 120)"/>
      <ellipse cx="200" cy="-300" rx="36" ry="13" transform="rotate(-18 200 -300)"/>
      <ellipse cx="-40" cy="-400" rx="40" ry="14" transform="rotate(-8 -40 -400)"/>
      <ellipse cx="40" cy="400" rx="34" ry="12" transform="rotate(6 40 400)"/>
      <ellipse cx="-380" cy="60" rx="30" ry="12" transform="rotate(-60 -380 60)"/>
    </g>
    <circle r="452" fill="none" stroke="#F3C58C" stroke-width="3" opacity="0.28"/>
    <path d="M-420 -180 A452 452 0 0 1 120 -430" fill="none" stroke="#FFE3BC" stroke-width="8" opacity="0.16" stroke-linecap="round"/>
  </g>

  <g fill="#E9DCC4" opacity="0.22">
    <circle cx="250" cy="240" r="3"/>
    <circle cx="300" cy="196" r="2"/>
    <circle cx="210" cy="300" r="2.4"/>
    <circle cx="1090" cy="420" r="2.6"/>
    <circle cx="1150" cy="380" r="2"/>
    <circle cx="980" cy="1080" r="2.2"/>
