<?xml version="1.0" encoding="UTF-8"?>
<!--
  SOCIAL SHARE CARD — source artwork for the Open Graph / WhatsApp preview image.
  ---------------------------------------------------------------------------
  The site links to the bitmap export, not to this file, because social
  platforms do not support SVG for link previews. Generate the export with:

      powershell -ExecutionPolicy Bypass -File tools/export-images.ps1
        ->  assets/img/og-volcana-lounge.png   (1200 x 630 px)

  Edit the artwork below if you want to change the card, then re-run the script.
  See IMAGE-GUIDE.md for the full walkthrough.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0A09"/>
      <stop offset="0.55" stop-color="#171210"/>
      <stop offset="1" stop-color="#2A1B12"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.78" cy="0.78" r="0.6">
      <stop offset="0" stop-color="#E28B3B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E28B3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ogLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E28B3B"/>
      <stop offset="1" stop-color="#C8A15A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- volcanic ridge motif -->
  <path d="M0 470 L140 430 L260 466 L400 360 L520 452 L640 300 L780 448 L900 372 L1030 452 L1150 402 L1200 430 L1200 630 L0 630 Z"
        fill="#100D0B" opacity="0.85"/>
  <path d="M0 540 L180 500 L360 546 L540 470 L720 540 L900 484 L1080 546 L1200 512 L1200 630 L0 630 Z"
        fill="#0A0807"/>

  <!-- volcano mark -->
  <path d="M76 200 L146 108 L186 166 L214 132 L300 200 Z" fill="none" stroke="url(#ogLine)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M146 108 L166 142 L146 158 L130 136 Z" fill="#E28B3B"/>

  <text x="76" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#F4EDE1">Volcana Lounge</text>
  <text x="76" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#C8A15A">Taste the Spirit of Musanze</text>

  <rect x="76" y="370" width="120" height="2" fill="url(#ogLine)" opacity="0.8"/>
  <text x="76" y="418" font-family="Helvetica, Arial, sans-serif" font-size="21" letter-spacing="1.2" fill="#D8CDBD">
    Wood-fired pizza &#183; Local &amp; international dishes
  </text>
  <text x="76" y="456" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="1.2" fill="#9A8F83">
    Musanze, Rwanda &#183; Open daily 11:30 AM &#8211; 11:00 PM &#183; +250 785 818 501
  </text>
</svg>