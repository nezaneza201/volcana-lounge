<?xml version="1.0" encoding="UTF-8"?>
<!-- PLACEHOLDER ARTWORK — wide volcano landscape. Replace with a real photo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" width="1920" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ridgeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0B0A"/>
      <stop offset="0.38" stop-color="#241B14"/>
      <stop offset="0.62" stop-color="#5A3418"/>
      <stop offset="0.76" stop-color="#B0651F"/>
      <stop offset="0.86" stop-color="#E28B3B" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#100E0C"/>
    </linearGradient>
    <radialGradient id="ridgeSun" cx="0.3" cy="0.72" r="0.36">
      <stop offset="0" stop-color="#F7C184" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#E28B3B" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E28B3B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B543F"/>
      <stop offset="1" stop-color="#2C231C"/>
    </linearGradient>
    <linearGradient id="ridgeB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38301F" stop-opacity="1"/>
      <stop offset="1" stop-color="#1A1613"/>
    </linearGradient>
    <linearGradient id="ridgeC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161311"/>
      <stop offset="1" stop-color="#0A0908"/>
    </linearGradient>
    <linearGradient id="ridgeHaze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3C79B" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#F3C79B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#F3C79B" stop-opacity="0"/>
    </linearGradient>
    <filter id="ridgeGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1920" height="900" fill="url(#ridgeSky)"/>
  <rect width="1920" height="900" fill="url(#ridgeSun)"/>

  <g fill="#F0D2AE" opacity="0.1">
    <ellipse cx="640" cy="230" rx="520" ry="20"/>
    <ellipse cx="1420" cy="180" rx="440" ry="16"/>
    <ellipse cx="1080" cy="300" rx="620" ry="14"/>
  </g>

  <!-- far chain: five prominent cones + saddle ridges -->
  <path fill="url(#ridgeA)" opacity="0.8"
    d="M0 560 L120 560 L260 400 L360 556 L470 556 L600 330 L740 552 L880 552 L1010 392 L1140 556 L1300 556 L1440 300 L1600 550 L1760 550 L1860 430 L1920 540 L1920 900 L0 900 Z"/>
  <rect x="0" y="500" width="1920" height="110" fill="url(#ridgeHaze)"/>

  <path fill="url(#ridgeB)"
    d="M0 660 L150 660 L340 470 L520 660 L700 660 L880 430 L1060 660 L1240 660 L1400 520 L1580 660 L1760 660 L1920 590 L1920 900 L0 900 Z"/>
  <rect x="0" y="612" width="1920" height="100" fill="url(#ridgeHaze)" opacity="0.75"/>

  <!-- nearest slope in deep shadow -->
  <path fill="url(#ridgeC)"
    d="M0 790 L300 748 L620 792 L940 726 L1240 786 L1520 722 L1780 782 L1920 736 L1920 900 L0 900 Z"/>

  <!-- a few birds, tiny, to give scale -->
  <g stroke="#E7C39A" stroke-width="1.6" fill="none" opacity="0.28" stroke-linecap="round">
    <path d="M700 190 q10 -8 20 0"/>
    <path d="M740 210 q9 -7 18 0"/>
    <path d="M1180 150 q11 -9 22 0"/>
  </g>

  <rect width="1920" height="900" filter="url(#ridgeGrain)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <text x="1870" y="872" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14"
        letter-spacing="4" fill="#B6AB9E" opacity="0.38">PLACEHOLDER ARTWORK · REPLACE WITH OFFICIAL PHOTO</text>
</svg>